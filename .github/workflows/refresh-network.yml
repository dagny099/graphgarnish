name: Refresh network data

# Pulls the Catalog & Cocktails RSS feed, rebuilds the network JSON, and
# commits it if anything changed. GitHub's runners have open outbound
# network access, so nothing needs to run on a laptop.

on:
  schedule:
    - cron: "0 13 * * 1"   # Mondays, 13:00 UTC
  workflow_dispatch:        # or press "Run workflow" in the Actions tab
    inputs:
      feed_url:
        description: "Override the RSS feed URL"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the builder still behaves
        run: python3 tools/test_build_network.py

      - name: Rebuild from the feed
        id: build
        # The URL reaches the shell through the environment, never through
        # ${{ }} interpolation: the feed URL contains an "&", and a directly
        # interpolated input is also an injection vector.
        env:
          FEED_URL: ${{ github.event.inputs.feed_url }}
        run: |
          set -o pipefail
          if [ -n "$FEED_URL" ]; then
            python3 tools/build_network.py --feed "$FEED_URL" --report 2>&1 | tee build.log
          else
            python3 tools/build_network.py --feed --report 2>&1 | tee build.log
          fi

      - name: Fail if the feed could not be reached
        run: |
          if grep -q "feed fetch failed" build.log; then
            echo "::error::RSS fetch failed; refusing to commit a feed-less rebuild."
            exit 1
          fi

      - name: Summarize
        run: |
          {
            echo '### Network rebuild'
            echo '```'
            cat build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit if the graph changed
        run: |
          rm -f build.log
          if [ -z "$(git status --porcelain)" ]; then
            echo "No change."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refresh network data from RSS feed

          Regenerated by .github/workflows/refresh-network.yml."
          git push
