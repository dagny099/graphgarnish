name: QA probe (temporary)
on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/qa-probe.yml"]
permissions:
  contents: read
jobs:
  sample:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        part: [0, 1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q faster-whisper
      - name: Transcribe a spread of episodes
        run: |
          python3 - <<'PY'
          import sys; sys.argv=['x']; sys.path.insert(0,'tools')
          PY
          time python3 tools/qa_graph.py podcasts/catalog-and-cocktails.json --sample 8 --shard ${{ matrix.part }}/2
          python3 tools/qa_graph.py podcasts/catalog-and-cocktails.json --sample 8 --offline --no-llm --report --out-dir /tmp/qa
      - name: Answers and question context
        run: |
          python3 - <<'PY'
          import json, glob, re, sys
          sys.path.insert(0, 'tools'); import qa_graph as qa
          for q in ('advice', 'invite-next'):
              for r in json.load(open(f'/tmp/qa/catalog-and-cocktails-{q}/answers.json')):
                  if r['has_transcript']:
                      print(f"[{q}] {r['date']} {r['guests']} found={r['found']} {r['reason']} :: {r['answer'][:300]} :: people={r['people']} ents={r['entities']}")
          pat = re.compile(r'advice|invite|resource|who should|next|bring on|have on|final|wrap|three questions|lightning', re.I)
          for f in sorted(glob.glob('.cache/qa/catalog-and-cocktails/transcripts/*.json')):
              d = json.load(open(f)); segs = d['segments']
              print('=====', f.split('/')[-1], 'window_start', d.get('window_start'))
              for i, s in enumerate(segs):
                  if pat.search(s['text']):
                      ctx = segs[max(0, i-1): i+4]
                      print('  ...', ' | '.join(f"[{c['start']}] {c['text']}" for c in ctx))
          PY
