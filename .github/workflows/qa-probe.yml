name: QA probe (temporary)
on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/qa-probe.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Look for transcripts on Omny and the show site
        run: |
          EP='https://omny.fm/shows/catalog-and-cocktails-the-honest-no-bs-data-podcast/ai-inherits-the-business-choices-you-never-made-with-david-krauza'
          CLIP=99e1d43a-cf27-4d90-9ae3-b4d000c2150a
          ORG=922e0f19-2d84-4485-835c-a83f00036b00
          try() { code=$(curl -sSL -A 'Mozilla/5.0 GraphGarnish' -o out.bin -w '%{http_code} %{content_type}' "$1"); echo "== $code  $(wc -c < out.bin)B  $1"; head -c ${2:-600} out.bin | tr '\n' ' '; echo; }
          try "$EP/transcript" 1500
          try "$EP/transcript?format=TextWithTimestamps" 1500
          try "$EP/transcript?format=WebVTT" 800
          try "$EP/transcript?format=SubRip" 800
          try "https://api.omny.fm/orgs/$ORG/clips/$CLIP" 3000
          try "https://omny.fm/api/orgs/$ORG/clips/$CLIP" 1500
          curl -sSL -A 'Mozilla/5.0' "$EP" -o ep.html; echo "episode page $(wc -c < ep.html)B"; grep -oiE '.{80}transcript.{120}' ep.html | head -10
          curl -sSL -A 'Mozilla/5.0' https://honestnobsdata.com/ -o site.html; echo "site $(wc -c < site.html)B"; grep -oiE '.{60}transcript.{100}' site.html | head -5; grep -oE 'href="[^"]+"' site.html | sort -u | head -40
          echo '--- full transcript tail if any'
          curl -sSL -A 'Mozilla/5.0' "$EP/transcript?format=TextWithTimestamps" -o t.txt; wc -c t.txt; tail -c 5000 t.txt
