name: QA probe (temporary)
on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/qa-probe.yml", "tools/qa_graph.py"]
permissions:
  contents: read
jobs:
  whisper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q faster-whisper
      - name: Transcribe three episode tails and run the pipeline
        run: |
          nproc
          time python3 tools/qa_graph.py podcasts/catalog-and-cocktails.json --limit 3 --report --out-dir /tmp/qa --no-llm
      - name: Show the transcript tails
        run: |
          for f in .cache/qa/catalog-and-cocktails/transcripts/*.json; do
            echo "=== $f"
            python3 -c "import json,sys;d=json.load(open(sys.argv[1]));[print(f\"[{s['start']:7.1f}] {s['text']}\") for s in d['segments']]" "$f"
          done
